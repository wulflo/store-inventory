[package]
name = "inventario-tienda"
version = "1.0.0"
edition = "2021"

[lib]
name = "inventario_tienda"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sincronización P2P cifrada LAN (fase 2)
rustls = "0.23"
rustls-pki-types = "1.0"
rcgen = "0.11"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "sync"] }
tokio-rustls = "0.26"
rand = "0.8"
# Actualizaciones (fase 5). El plugin solo soporta Windows/Linux/macOS;
# en Android se actualiza reinstalando el APK o desde la tienda.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
# En Android se usará el almacenamiento privado de la app (context) y,
# cuando se implemente el backend SAF, un plugin Kotlin/JNI.
# Por ahora se compila sin dependencias extra de Android.

[target.'cfg(target_os = "linux")'.dependencies]
# Las dependencias del sistema (webkit2gtk, libsoup, gtk3) se instalan
# en el entorno del sistema, no vía Cargo.

[target.'cfg(target_os = "windows")'.dependencies]

[profile.release]
opt-level = 2
debug = false
