[package]
name = "inventario-tienda"
version = "0.1.6"
edition = "2021"

[lib]
name = "inventario_tienda"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
# Sincronización P2P cifrada LAN.
# Usamos el proveedor `ring` de rustls de forma explícita para que la
# verificación de certificados fijados (pinning) sea determinista y no dependa
# de qué proveedor criptográfico haya instalado otro crate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1"
rcgen = "0.14"
sha2 = "0.10"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rand = "0.8"
if-addrs = "0.13"
# Actualizador multiplataforma: en escritorio usa tauri-plugin-updater; en
# Android descarga el APK y lo guarda en Descargas.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
minisign-verify = "0.3"
semver = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Actualizaciones de escritorio (fase 5). El plugin oficial no soporta Android;
# allí el actualizador se implementa en este mismo crate.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
# Puente JNI para guardar el APK descargado en la carpeta pública Descargas
# usando MediaStore (Android 10+) o el directorio público legacy (Android 9).
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Las dependencias del sistema (webkit2gtk, libsoup, gtk3) se instalan
# en el entorno del sistema, no vía Cargo.

[target.'cfg(target_os = "windows")'.dependencies]

[profile.release]
opt-level = 2
debug = false
