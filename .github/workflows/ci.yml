name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Verificaciones estáticas y tests
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas unitarias (vitest)
        run: npm test

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Dependencias de sistema para Tauri (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Formato Rust (informativo)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy (informativo)
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Tests Rust (sync)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ------------------------------------------------------------------
  # Build desktop Linux sin bundle ni firma
  # ------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Build frontend (Vite)
        run: npm run build

      - name: Compilar Tauri (Linux, sin bundle)
        run: npx tauri build --no-bundle

  # ------------------------------------------------------------------
  # Build desktop Windows sin bundle ni firma
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend (Vite)
        run: npm run build

      - name: Compilar Tauri (Windows, sin bundle)
        run: npx tauri build --no-bundle

  # ------------------------------------------------------------------
  # Build Android debug (valida SDK/NDK y el entrypoint móvil)
  # ------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar platform, build-tools y NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.0.12077973" \
            "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Instalar Rust y target Android (arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Compilar APK debug
        run: npx tauri android build --debug --apk --target aarch64

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
