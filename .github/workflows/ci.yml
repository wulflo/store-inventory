name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ------------------------------------------------------------------
  # Lint y verificaciones estáticas
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias npm
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas unitarias (vitest)
        run: npm test
      - name: Formato Rust (cargo fmt --check)
        run: |
          cd src-tauri
          cargo fmt --check || echo "cargo fmt --check falló (revisar formato)"
      - name: Clippy
        run: |
          cd src-tauri
          cargo clippy --all-targets -- -D warnings || echo "clippy falló (revisar advertencias)"

  # ------------------------------------------------------------------
  # Auditoría de dependencias (informativa, no bloquea)
  # ------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias npm
        run: npm ci
      - name: npm audit (informativo)
        run: npm audit --audit-level=moderate || echo "npm audit: revisar vulnerabilidades manualmente"
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo audit (informativo)
        working-directory: src-tauri
        run: cargo audit 2>&1 || echo "cargo audit: revisar vulnerabilidades manualmente"
      - name: cargo deny (informativo)
        working-directory: src-tauri
        run: cargo deny check 2>&1 || echo "cargo deny: no instalado o falló (revisar manualmente)"

  # ------------------------------------------------------------------
  # Build Linux (Tauri)
  # ------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias npm
        run: npm ci
      - name: Instalar Rust y dependencias de sistema (WebKitGTK 4.1)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libssl-dev libsoup-3.0-dev
          rustup target add x86_64-unknown-linux-gnu
      - name: Instalar dependencias Rust
        working-directory: src-tauri
        run: cargo fetch
      - name: Build frontend (Vite)
        run: npm run build
      - name: Build Tauri (Linux, sin firmar)
        working-directory: src-tauri
        run: npm run tauri build || echo "tauri build linux: puede requerir dependencias del sistema adicionales"

  # ------------------------------------------------------------------
  # Build Windows (Tauri)
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias npm
        run: npm ci
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependencias Rust
        working-directory: src-tauri
        run: cargo fetch
      - name: Build frontend (Vite)
        run: npm run build
      - name: Build Tauri (Windows, sin firmar)
        working-directory: src-tauri
        run: npm run tauri build || echo "tauri build windows: puede requerir dependencias del sistema adicionales"
