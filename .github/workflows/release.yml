name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry-run (crear release draft, no publicar)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Verificar versión, tests y coherencia del tag
  # ------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validar árbol limpio
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Árbol de trabajo no limpio" >&2
            exit 1
          fi

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Validar versión y tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con package.json ($VERSION)" >&2
            exit 1
          fi
          node scripts/version.mjs check

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Typecheck y tests
        run: |
          npm run typecheck
          npm test

      - name: Tests Rust (sync)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ------------------------------------------------------------------
  # Build Linux (deb + AppImage + firma updater)
  # ------------------------------------------------------------------
  build-linux:
    needs: [verify]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Build y firma (Linux)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build -- --bundles deb,appimage

      - name: Subir artefactos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Build Windows (MSI + NSIS + firma updater). Sin certificado Authenticode.
  # ------------------------------------------------------------------
  build-windows:
    needs: [verify]
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build y firma (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build -- --bundles msi,nsis

      - name: Subir artefactos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Build Android release firmado (APK + AAB)
  # ------------------------------------------------------------------
  build-android:
    needs: [verify]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK preinstalado
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Instalar platform, build-tools, NDK y CMake
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Instalar Rust y targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Configurar firma Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$RUNNER_TEMP/keystore.jks" > keystore.properties
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          chmod 600 keystore.properties "$RUNNER_TEMP/keystore.jks"

      - name: Build APK y AAB firmados
        run: npx tauri android build --apk --aab --target aarch64 armv7 i686 x86_64

      - name: Subir artefactos Android
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publicar release + latest.json real (con firmas)
  # ------------------------------------------------------------------
  publish:
    needs: [verify, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    environment:
      name: release
      # En dry-run no existe el tag público: enlazar a Releases evita un 404.
      url: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true') && format('{0}/{1}/releases', github.server_url, github.repository) || format('{0}/{1}/releases/tag/v{2}', github.server_url, github.repository, needs.verify.outputs.version) }}
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generar latest.json con firmas reales
        run: |
          node scripts/latest-json.mjs \
            --version "${{ needs.verify.outputs.version }}" \
            --tag "v${{ needs.verify.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --artifacts artifacts \
            --out latest.json

      - name: Crear/actualizar deployment (GitHub)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.verify.outputs.version }}';
            const tag = `v${version}`;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: tag,
              task: 'release',
              auto_merge: false,
              required_contexts: [],
              environment: 'release',
              description: `Inventario Tienda ${tag}`,
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'in_progress',
              environment: 'release',
              description: 'Publicando artefactos y latest.json',
            });

      - name: Publicar release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: Inventario Tienda v${{ needs.verify.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true' }}
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*
            latest.json

      - name: Marcar deployment como éxito
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true') && always()
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.verify.outputs.version }}';
            const tag = `v${version}`;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'release',
              ref: tag,
              per_page: 5,
            });
            if (!deployments.length) return;
            const deploymentId = deployments[0].id;
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state,
              environment: 'release',
              description: state === 'success' ? 'Release publicado' : 'Release fallido',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Resumen del release
        run: |
          {
            echo "### Release generado"
            echo ""
            echo "- URL: ${{ steps.create-release.outputs.url }}"
            echo "- Dry-run: ${{ github.event.inputs.dry-run }}"
          } >> "$GITHUB_STEP_SUMMARY"
